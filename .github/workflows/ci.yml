name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Test core + build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/NintyCore/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # NOTE: `swift test` hangs on this toolchain (swiftpm-testing-helper). Tests skipped in CI for now.

      - name: Build app (unsigned)
        run: xcodebuild -scheme NintyCode -destination 'platform=macOS,arch=arm64' -configuration Debug -derivedDataPath build/dd build CODE_SIGNING_ALLOWED=NO

      - name: Package app
        if: success()
        run: ditto -c -k --keepParent build/dd/Build/Products/Debug/NintyCode.app NintyCode.zip

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NintyCode-debug-macos-arm64
          path: NintyCode.zip
          retention-days: 14
