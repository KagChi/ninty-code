name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Test core + build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/NintyCore/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Test NintyCore
        # swiftpm-testing-helper hangs on this toolchain; run the test binary directly.
        run: |
          swift build --package-path Packages/NintyCore --build-tests
          BIN=$(swift build --package-path Packages/NintyCore --build-tests --show-bin-path)
          "$BIN/NintyCorePackageTests.xctest/Contents/MacOS/NintyCorePackageTests"

      - name: Build app (unsigned)
        run: xcodebuild -scheme NintyCode -destination 'platform=macOS,arch=arm64' -configuration Debug build CODE_SIGNING_ALLOWED=NO
